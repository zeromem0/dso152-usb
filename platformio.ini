; dso152-usb: the FNIRSI DSO-152's own USB socket as a CDC virtual COM port.
; Copied from dso152-modbus (menu, themes, settings) without the tester.
;
; USBCON and USBD_USE_CDC (through PIO_FRAMEWORK_ARDUINO_ENABLE_CDC) build the
; core's USB device library with the CDC class; SerialUSB is then the port.
; The dso152-bl-nousb build is the same without it, to see what USB costs.
;
; build_src_flags forces Arduino.h into every file under src/.
; The platform and the library are pinned to the versions this was built with.

[platformio]
default_envs = dso152

[env:dso152]
platform = ststm32@19.0.0
board = genericSTM32F103R8
board_build.mcu = stm32f103r8t6
framework = arduino

debug_tool = stlink
upload_protocol = stlink
upload_resetmethod = none separate

build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_CDC_USE_SINGLE_BUFFER -D CDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=8 -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=8 -D USB_CDC_TRANSMIT_TIMEOUT=500
build_src_flags = -include Arduino.h

lib_deps = adafruit/Adafruit GFX Library@1.12.6

; The program ends at 0x0800F800. The page from there to 0x0800FBFF holds the
; settings (src/Config.cpp), and the stock calibration starts at 0x0800FC00.
board_upload.maximum_size = 63488

; Linked above the FNIRSI bootloader, at the address of the original
; application (0x08003C00), and stopping short of the calibration pages at
; 0x0800FC00. This is the image that could go through the USB-drive update,
; if the bootloader accepts it; an SWD upload of it touches only its own pages.
[env:dso152-bl]
extends = env:dso152
board_build.flash_offset = 0x3C00
board_upload.offset_address = 0x08003C00
; As above: to 0x0800F800. The linker takes the offset off this itself, which
; leaves 48128 bytes for the program; the percentage PlatformIO prints is of
; the whole 63488 and so reads low.
board_upload.maximum_size = 63488

; dso152-bl without USB, only to see how much the USB stack takes.
[env:dso152-bl-nousb]
extends = env:dso152-bl
build_flags =

; dso152-bl that hands every rectangle it draws to a laptop over SWD, so that
; screens can be pictured. It waits for the laptop, so it is of no use alone.
[env:dso152-bl-shot]
extends = env:dso152-bl
build_flags = ${env:dso152.build_flags} -DSCREEN_TAP
